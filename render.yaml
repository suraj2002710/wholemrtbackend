services:
  - type: web
    name: ave-catering-api
    env: node
    plan: starter
    
    buildCommand: |
      curl -fsSL https://get.pnpm.io/install.sh | sh -
      export PNPM_HOME="$HOME/.local/share/pnpm"
      export PATH="$PNPM_HOME:$PATH"
      pnpm install --frozen-lockfile
      pnpm run build

    startCommand: node dist/server.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # Database Configuration (Set in Render Dashboard)
      - key: MONGODB_URI
        sync: false

      # JWT Secret (Set in Render Dashboard)
      - key: JWT_SECRET
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        value: dqjhf8ios
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # CORS
      - key: FRONTEND_URL
        value: https://ave-catering.vercel.app

    healthCheckPath: /health
